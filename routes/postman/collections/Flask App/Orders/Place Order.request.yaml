$kind: http-request
name: Place Order
url: '{{base_url}}/orders/place-order'
method: POST
body:
  type: formdata
  content:
    - key: address_type
      type: text
      value: saved
    - key: address_id
      type: text
      value: '1'
    - key: payment_method
      type: text
      value: COD
