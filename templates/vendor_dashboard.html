<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendor Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#eef2ff;
}

.navbar{
background:#4338ca;
color:white;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logout{
background:red;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

.container{
width:90%;
margin:30px auto;
}

.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:40px;
}

.stat{

background:white;

padding:25px;

text-align:center;

border-radius:12px;

box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.actions{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;
}

.action{

background:white;

padding:30px;

border-radius:12px;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,.1);

transition:.3s;
}

.action:hover{

transform:translateY(-8px);

}

button{

margin-top:20px;

background:#4338ca;

color:white;

padding:10px 20px;

border:none;

border-radius:8px;

cursor:pointer;
}

</style>

</head>

<body>

<div class="navbar">

<h2>🏪 Vendor Dashboard</h2>

<a href="/">
<button class="logout">Logout</button>
</a>

</div>

<div class="container">

<h1>Welcome Vendor 👋</h1>

<br>

<div class="stats">

<div class="stat">
<h2>15</h2>
<p>Total Products</p>
</div>

<div class="stat">
<h2>42</h2>
<p>Total Orders</p>
</div>

<div class="stat">
<h2>₹18,500</h2>
<p>Total Sales</p>
</div>

<div class="stat">
<h2>4.8 ⭐</h2>
<p>Average Rating</p>
</div>

</div>

<h2>Quick Actions</h2>

<br>

<div class="actions">

<div class="action">

<h1>➕</h1>

<h3>Add Product</h3>

<p>Create a new product.</p>

<a href="/add-product">
<button>Add</button>
</a>

</div>

<div class="action">

<h1>📦</h1>

<h3>My Products</h3>

<p>Manage products.</p>

<a href="/my-products">
<button>Open</button>
</a>

</div>

<div class="action">

<h1>📝</h1>

<h3>Orders</h3>

<p>View customer orders.</p>

<a href="/vendor-orders">
<button>Open</button>
</a>

</div>

<div class="action">

<h1>👤</h1>

<h3>Profile</h3>

<p>Edit vendor profile.</p>

<button>Edit</button>

</div>

</div>

</div>

</body>
</html>
