<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        .container{
            width:600px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-weight:bold;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        textarea{
            resize:none;
            height:120px;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:12px;
            border:none;
            border-radius:6px;
            background:#0d6efd;
            color:white;
            font-size:17px;
            cursor:pointer;
        }

        button:hover{
            background:#0b5ed7;
        }
    </style>

</head>
<body>

<div class="container">

<h2>Add New Product</h2>

<form action="/add_product" method="POST" enctype="multipart/form-data">

<label>Vendor ID</label>
<input type="number" name="vendor_id" required>

<label>Product Name</label>
<input type="text" name="name" required>

<label>Category</label>
<select name="category_id">
    <option value="1">Electronics</option>
    <option value="2">Fashion</option>
    <option value="3">Books</option>
    <option value="4">Home & Kitchen</option>
    <option value="5">Sports</option>
</select>

<label>Base Price (₹)</label>
<input type="number" step="0.01" name="base_price" required>

<label>MRP (₹)</label>
<input type="number" step="0.01" name="mrp" required>

<label>Stock</label>
<input type="number" name="stock" value="0">

<label>GST Rate (%)</label>
<input type="number" step="0.01" name="gst_rate" required>

<label>Status</label>
<select name="status">
    <option value="ACTIVE">ACTIVE</option>
    <option value="INACTIVE">INACTIVE</option>
</select>

<label>Description</label>
<textarea name="description"></textarea>

<button type="submit">
Add Product
</button>

</form>

</div>

</body>
</html>
