<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        .main{
            margin-top: 50px;
           background:#2563eb;
            width: 300px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
            border-radius: 30px;
            color: orange;
        }
        input{

            border-radius: 20px;
            height: 40px;
            width: 200px;
        }
    </style>
</head>
<body>
    <center>
        <h1>Login</h1>
        <form class="main" action="/login" method="post">
      


<input type="email" name="email" placeholder="Email" required>



<input type="password" name="password" placeholder="Password" required>



        <input  type="submit" value="Login" style="background-color: rgb(195, 112, 53);color: aliceblue;font-weight: bolder;">
    </form>
    </center>
</body>
</html>
