<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
    
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
    }
    
    body{
    background:#f5f7fa;
    
    }
    
    h1{
    text-align:center;
    margin-bottom:30px;
    color:#fbfafa;
    background: #0f0f0f;
    height: 100px;
    font-weight: bolder;
    font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }
    
    .products-container{
    
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
    
    }
    
    .product-card{
    
    background:white;
    width:250px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    text-align:center;
    padding:20px;
    transition:.3s;
    height: 300px;
    
    }
    
    .product-card:hover{
    
    transform:translateY(-8px);
    
    }
    
    .product-card img{
    
    width:100px;
    height:100px;
    border-radius:15px;
    object-fit:cover;
    
    }
    
    .product-content{
    
    margin-top:15px;
    
    }
    
    .product-content h3{
    
    margin-bottom:10px;
    
    }
    
    .product-content p{
    
    color:#555;
    margin-bottom:10px;
    font-size: auto;
    padding: 10px;
    height: 30px;
    
    }
    
    .price{
    
    font-size:22px;
    color:green;
    font-weight:bold;
    margin-bottom:15px;
    
    }
    
    .btn{
    
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    cursor:pointer;
    font-size:16px;
    
    }
    
    .btn:hover{
    
    background:#0056b3;
    
    }
    
    </style>
</head>
<body>

<h1>All Products</h1>

<div class="products-container">

{% for product in products %}

<div class="product-card">

    <img src="https://picsum.photos/200?random={{ product.id }}">

    <div class="product-content">

        <h3>{{ product.name }}</h3>

        

        <div class="price">
            ₹{{ product.mrp }}
        </div>

        <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST">

            <button class="btn" type="button"
    data-id="{{ product.id }}"
    onclick="addToCart(this)"
            >
                Add To Cart
            </button>

        </form>

    </div>

</div>

{% endfor %}

</div>
</body>
<script src="static/js/home.js"></script>
</html>
