
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Poppins", Arial, sans-serif;
    background: #f6f7fb;
    color: #222;
}

/* ================= HEADER ================= */

.products-header {
    background: linear-gradient(135deg, #111827, #1f2937);
    color: white;
    padding: 55px 20px;
    text-align: center;
    margin-bottom: 40px;
    position: relative;
}

.header-actions {
    position: absolute;
    top: 18px;
    right: 20px;
    display: flex;
    gap: 10px;
    align-items: center;
}

.nav-btn {
    background: rgba(255,255,255,0.08);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.08);
}

.nav-btn:hover {
    background: rgba(255,255,255,0.14);
}

.nav-btn.go-cart {
    background: #16a34a;
    border-color: rgba(0,0,0,0.08);
}

.nav-btn.go-cart:hover {
    background: #139a3d;
}

@media (max-width: 600px) {
    .header-actions {
        position: static;
        margin-top: 12px;
        justify-content: center;
    }
}

.products-header h1 {
    font-size: 38px;
    font-weight: 700;
    margin-bottom: 10px;
}

.products-header p {
    color: #cbd5e1;
    font-size: 15px;
}


/* ================= PRODUCTS CONTAINER ================= */

.products-container {
    width: 90%;
    max-width: 1250px;
    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(240px, 1fr));

    gap: 25px;

    padding-bottom: 50px;
}


/* ================= PRODUCT CARD ================= */

.product-card {

    background: white;

    border-radius: 18px;

    padding: 18px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.06);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    position: relative;

    overflow: hidden;

    min-height: 390px;

    display: flex;
    flex-direction: column;
}


.product-card:hover {

    transform: translateY(-7px);

    box-shadow:
        0 15px 35px rgba(0,0,0,0.12);

}


/* ================= IMAGE ================= */

.product-image-container {

    width: 100%;
    height: 210px;

    border-radius: 14px;

    background: #f3f4f6;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    margin-bottom: 18px;
}


.product-card img {

    width: 180px;
    height: 180px;

    object-fit: cover;

    border-radius: 12px;

    transition: transform .3s ease;
}


.product-card:hover img {

    transform: scale(1.06);

}


/* ================= PRODUCT INFO ================= */

.product-content {

    flex: 1;

    display: flex;
    flex-direction: column;
}


.product-content h3 {

    font-size: 18px;

    margin-bottom: 8px;

    color: #111827;

}


.product-content p {

    font-size: 13px;

    color: #6b7280;

    line-height: 1.5;

    height: 42px;

    overflow: hidden;

    margin-bottom: 12px;

}


/* ================= PRICE ================= */

.price {

    font-size: 21px;

    font-weight: 700;

    color: #16a34a;

    margin-bottom: 15px;
}


/* ================= BUTTON ================= */

.cart-btn {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: var(--primary, #2563eb);

    color: white;

    cursor: pointer;

    font-size: 15px;

    font-weight: 600;

    transition: .18s;

    text-align: center;

}


.cart-btn:hover {

    background: var(--primary-600, #174bb0);

    transform: translateY(-1px);


}


/* ================= ALREADY CART ================= */

.cart-btn.already-cart {

    background: #16a34a;

    cursor: default;

}


.cart-btn.already-cart:hover {

    background: #16a34a;

    transform: none;

}


/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .products-header {

        padding: 40px 15px;

    }

    .products-header h1 {

        font-size: 28px;

    }

    .products-container {

        width: 92%;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 15px;

    }

    .product-card {

        min-height: 350px;

        padding: 12px;

    }

    .product-image-container {

        height: 150px;

    }

    .product-card img {

        width: 120px;
        height: 120px;

    }

    .product-content h3 {

        font-size: 15px;

    }

    .product-content p {

        font-size: 12px;

    }

    .price {

        font-size: 18px;

    }

}

</style>


</style>
<div class="products-header">

    <div class="header-actions">
        <a href="/" class="nav-btn">Home</a>
        <a href="/cart" class="nav-btn go-cart">Go to Cart </a>
    </div>

    <h1>All Products</h1>

    <p>
        Discover products from verified sellers
    </p>

</div>


<div class="products-container">

    {% for product in products %}

    <div class="product-card">

        <!-- PRODUCT IMAGE -->

        <div class="product-image-container">

            <img
                src="https://picsum.photos/seed/{{ product.id }}/300/300"
                alt="{{ product.name }}"
            >

        </div>


        <!-- PRODUCT INFORMATION -->

        <div class="product-content">

            <h3>
                {{ product.name }}
            </h3>


            <p>
                {{ product.description }}
            </p>


            <div class="price">

                ₹{{ product.mrp }}

            </div>


            <!-- CART BUTTON -->

            {% if product.id in cart_ids %}

                <button
                    class="cart-btn already-cart"
                    type="button"
                    disabled
                >
                    ✓ Already in Cart
                </button>

            {% else %}

                <button
                    class="cart-btn"
                    type="button"
                    data-id="{{ product.id }}"
                    onclick="addToCart(this)"
                >
                    🛒 Add To Cart
                </button>

            {% endif %}

        </div>

    </div>

    {% endfor %}

</div>
<script>
document.addEventListener("DOMContentLoaded", () => {

    const cartItems = document.querySelectorAll(".cart-item");

    cartItems.forEach(item => {

        const productId = item.dataset.id;

        const minusBtn =
            item.querySelector(".minus-btn");

        const plusBtn =
            item.querySelector(".plus-btn");

        const quantitySpan =
            item.querySelector(".quantity-value");

        const priceElement =
            item.querySelector(".price");

        const subtotalElement =
            item.querySelector(".subtotal");


        const price = parseFloat(
            priceElement.textContent
                .replace("₹", "")
                .replace(/,/g, "")
                .trim()
        );


        let quantity =
            parseInt(quantitySpan.textContent.trim());


        // =========================
        // UPDATE SERVER
        // =========================

        async function updateServer() {

            try {

                const response = await fetch(
                    `/update-cart/${productId}`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            quantity: quantity
                        })
                    }
                );


                const data = await response.json();

                console.log("Update cart:", data);


                if (!data.success) {

                    alert(data.message);

                }

            } catch (error) {

                console.error("Update error:", error);

            }

        }


        // =========================
        // UPDATE UI
        // =========================

        function updateUI() {

            quantitySpan.textContent = quantity;


            const subtotal =
                price * quantity;


            subtotalElement.textContent =
                "₹" + subtotal.toLocaleString("en-IN");


            updateTotal();

        }


        // =========================
        // PLUS
        // =========================

        plusBtn.addEventListener("click", async () => {

            quantity++;

            updateUI();

            await updateServer();

        });


        // =========================
        // MINUS
        // =========================

        minusBtn.addEventListener("click", async () => {

            if (quantity <= 1) {
                return;
            }

            quantity--;

            updateUI();

            await updateServer();

        });

    });


    // =========================
    // UPDATE TOTAL
    // =========================

    function updateTotal() {

        let total = 0;


        document
            .querySelectorAll(".subtotal")
            .forEach(element => {

                total += parseFloat(
                    element.textContent
                        .replace("₹", "")
                        .replace(/,/g, "")
                        .trim()
                );

            });


        const summarySubtotal =
            document.querySelector(".summary-row strong");


        const totalElement =
            document.querySelector(".total-row strong");


        if (summarySubtotal) {

            summarySubtotal.textContent =
                "₹" + total.toLocaleString("en-IN");

        }


        if (totalElement) {

            totalElement.textContent =
                "₹" + total.toLocaleString("en-IN");

        }

    }

});

async function addToCart(button) {

    const productId = button && button.dataset && button.dataset.id;

    if (!productId) {
        console.error('No product id found on button');
        return;
    }

    // disable to prevent double clicks
    button.disabled = true;

    try {
        const response = await fetch(`/add-to-cart/${productId}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ quantity: 1 })
        });

        const contentType = response.headers.get('content-type') || '';
        let data = null;

        if (contentType.includes('application/json')) {
            try {
                data = await response.json();
            } catch (e) {
                console.warn('Failed to parse JSON response', e);
            }
        } else {
            // Try to read text and attempt to parse JSON if possible
            try {
                const text = await response.text();
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    // not JSON - ignore
                    data = null;
                }
            } catch (e) {
                console.warn('Failed to read non-JSON response', e);
            }
        }

        console.log('Add to cart response:', response.status, data);

        // Success cases:
        // 1) server returned JSON with { success: true }
        // 2) server returned a successful HTTP status (2xx) but no JSON body (common when server redirects)
        if ((data && data.success) || (response.ok && (!data || typeof data.success === 'undefined'))) {
            button.classList.add('already-cart');
            button.innerHTML = '✓ Already in Cart';
            button.disabled = true;
            return;
        }

        // Otherwise show error message
        const message = data && data.message ? data.message : `Could not add to cart (status ${response.status})`;
        alert(message);
        button.disabled = false;

    } catch (err) {
        console.error('Add to cart error:', err);
        alert('Error adding to cart. Please try again.');
        button.disabled = false;
    }

}

</script>
