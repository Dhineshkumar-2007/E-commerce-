<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fa;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.products-container{

    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;

}

.product-card{

    background:white;
    width:250px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    text-align:center;
    padding:20px;
    transition:.3s;

}

.product-card:hover{

    transform:translateY(-8px);

}

.product-card img{

    width:150px;
    height:150px;
    border-radius:15px;
    object-fit:cover;

}

.product-content{

    margin-top:15px;

}

.product-content h3{

    margin-bottom:10px;

}

.product-content p{

    color:#555;
    margin-bottom:10px;

}

.price{

    font-size:22px;
    color:green;
    font-weight:bold;
    margin-bottom:15px;

}

.btn{

    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    cursor:pointer;
    font-size:16px;

}

.btn:hover{

    background:#0056b3;

}

</style>

<h1>My Products</h1>

<div class="products-container">

{% for product in products %}

<div class="product-card">

    <img src="https://picsum.photos/200?random={{ product.id }}">

    <div class="product-content">

        <h3>{{ product.name }}</h3>

        <p>{{ product.description }}</p>

        <div class="price">
            ₹{{ product.mrp }}
        </div>
<button 

 type="button"
    data-id="{{ product.id }}"
    onclick="addToCart(this)"
>add to card</button>
      

        </form>

    </div>

</div>

{% endfor %}

</div>
